# Builds an UNSIGNED HuaSideload.ipa on a GitHub macOS runner. Sign it on Windows with Sideloadly.
# No secrets, certificates or Apple ID are used or needed here.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (make it unique, e.g. com.yourname.huasideload)"
        required: true
        default: "com.example.huasideload"

permissions:
  contents: read

jobs:
  build:
    # Intel image: the arm64 pool behind macos-latest repeatedly had no runner available (builds #7, #8)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run parsing tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Generate Xcode project
        env:
          HUASIDELOAD_BUNDLE_ID: ${{ inputs.bundle_id }}
          HUASIDELOAD_TEAM_ID: ""
        run: ./generate.sh

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project HuaSideload.xcodeproj \
            -target HuaSideload \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="build/Release-iphoneos/HuaSideload.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HuaSideload-unsigned.ipa Payload
          shasum -a 256 HuaSideload-unsigned.ipa | tee HuaSideload-unsigned.ipa.sha256
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | tee info-plist.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HuaSideload-unsigned-ipa
          path: |
            HuaSideload-unsigned.ipa
            HuaSideload-unsigned.ipa.sha256
            info-plist.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            test.log
